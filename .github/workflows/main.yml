- name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Security Support Logo
        shell: bash
        run: |
          set -e

          LOGO="assets/logo.png"
          RES="android/app/src/main/res"

          if [ ! -f "$LOGO" ]; then
            echo "ERROR: assets/logo.png not found"
            exit 1
          fi

          npm install --no-save sharp

          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');

          const source = 'assets/logo.png';
          const res = 'android/app/src/main/res';

          async function main() {
            const sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
            };

            for (const [folder, size] of Object.entries(sizes)) {
              const dir = path.join(res, folder);
              fs.mkdirSync(dir, { recursive: true });

              for (const name of ['ic_launcher.png', 'ic_launcher_round.png']) {
                await sharp(source)
                  .resize(size, size, {
                    fit: 'contain',
                    background: { r: 255, g: 255, b: 255, alpha: 1 }
                  })
                  .png()
                  .toFile(path.join(dir, name));
              }
            }

            const adaptiveDir = path.join(res, 'mipmap-anydpi-v26');
            fs.mkdirSync(adaptiveDir, { recursive: true });

            const foregroundDir = path.join(res, 'drawable');
            fs.mkdirSync(foregroundDir, { recursive: true });

            await sharp(source)
              .resize(432, 432, {
                fit: 'contain',
                background: { r: 0, g: 0, b: 0, alpha: 0 }
              })
              .png()
              .toFile(
                path.join(foregroundDir, 'ic_launcher_foreground.png')
              );

            const xml = `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          `;

            fs.writeFileSync(
              path.join(adaptiveDir, 'ic_launcher.xml'), xml
            );

            fs.writeFileSync(
              path.join(adaptiveDir, 'ic_launcher_round.xml'), xml
            );

            console.log('Security Support launcher icons applied.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
