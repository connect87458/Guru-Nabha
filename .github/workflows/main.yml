name: Build Security Support APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Security Support.zip"
      - "logo.png"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract website
        shell: bash
        run: |
          set -e

          mkdir -p website
          unzip -o "Security Support.zip" -d website

          INDEX_FILE="$(find website -type f -name index.html | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found in Security Support.zip"
            exit 1
          fi

          WEBSITE_ROOT="$(dirname "$INDEX_FILE")"

          mkdir -p www
          cp -R "$WEBSITE_ROOT"/. www/

          echo "Website files copied successfully."
          ls -la www

      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          npm init -y

          npm install @capacitor/core@latest @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest

          npx cap init "Security Support" "com.securitysupport.app" --web-dir www

          npx cap add android

      - name: Generate Android App Icons
        shell: bash
        run: |
          set -e

          if [ ! -f "logo.png" ]; then
            echo "ERROR: logo.png not found in repository root."
            exit 1
          fi

          npm install --no-save sharp

          cat > generate-icons.cjs <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const source = path.resolve('logo.png');
          const res = path.resolve('android/app/src/main/res');

          async function saveIcon(file, size, background) {
            const dir = path.dirname(file);
            fs.mkdirSync(dir, { recursive: true });

            await sharp(source)
              .resize(size, size, {
                fit: 'contain',
                background
              })
              .png()
              .toFile(file);
          }

          async function main() {
            const legacy = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
            };

            for (const [folder, size] of Object.entries(legacy)) {
              await saveIcon(
                path.join(res, folder, 'ic_launcher.png'),
                size,
                { r: 255, g: 255, b: 255, alpha: 0 }
              );

              await saveIcon(
                path.join(res, folder, 'ic_launcher_round.png'),
                size,
                { r: 255, g: 255, b: 255, alpha: 0 }
              );
            }

            const foregroundDir = path.join(res, 'drawable');
            fs.mkdirSync(foregroundDir, { recursive: true });

            // Android adaptive icons use a foreground layer.
            // Fit the full logo inside a safe area.
            await sharp(source)
              .resize(432, 432, {
                fit: 'contain',
                background: { r: 0, g: 0, b: 0, alpha: 0 }
              })
              .png()
              .toFile(path.join(foregroundDir, 'ic_launcher_foreground.png'));

            const anydpi = path.join(res, 'mipmap-anydpi-v26');
            fs.mkdirSync(anydpi, { recursive: true });

            fs.writeFileSync(
              path.join(anydpi, 'ic_launcher.xml'),
              `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>`
            );

            fs.writeFileSync(
              path.join(anydpi, 'ic_launcher_round.xml'),
              `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>`
            );

            console.log('Legacy and adaptive icons generated.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node generate-icons.cjs

      - name: Configure Android Back Button
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/securitysupport/app

          cat > android/app/src/main/java/com/securitysupport/app/MainActivity.java <<'EOF'
          package com.securitysupport.app;

          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (getBridge() == null
                      || getBridge().getWebView() == null) {
                      super.onBackPressed();
                      return;
                  }

                  WebView webView = getBridge().getWebView();

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      finish();
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android Launcher Icons
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if not re.search(r'<application\b', text):
              raise SystemExit("ERROR: application tag not found")

          def set_attribute(content, name, value):
              pattern = rf'(\b{re.escape(name)}\s*=\s*")[^"]*(")'
              if re.search(pattern, content):
                  return re.sub(pattern, rf'\g<1>{value}\g<2>', content, count=1)
              return content

          match = re.search(r'<application\b[^>]*>', text, re.DOTALL)
          tag = match.group(0)

          tag = set_attribute(tag, 'android:icon', '@mipmap/ic_launcher')
          tag = set_attribute(tag, 'android:roundIcon', '@mipmap/ic_launcher_round')

          text = text[:match.start()] + tag + text[match.end():]
          manifest.write_text(text)
          print("Launcher icon references configured.")
          PY

          echo "Verifying generated icons..."

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "All launcher icon files are ready."

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecuritySupport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
