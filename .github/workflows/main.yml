name: Build Security Support APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SecuritySupport.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract website
        run: |
          mkdir -p website
          unzip -o SecuritySupport.zip -d website
          find website -name index.html -print

      - name: Locate website root
        run: |
          INDEX_FILE=$(find website -name index.html -type f | head -n 1)
          if [ -z "$INDEX_FILE" ]; then
            echo "index.html not found in ZIP"
            exit 1
          fi
          WEBSITE_ROOT=$(dirname "$INDEX_FILE")
          mkdir -p www
          cp -R "$WEBSITE_ROOT"/. www/

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "Security Support" "com.securitysupport.app" --web-dir www
          npx cap add android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecuritySupport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
