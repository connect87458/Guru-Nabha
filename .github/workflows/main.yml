name: Build Security Support APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SecuritySupport.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract website
        shell: bash
        run: |
          set -e

          mkdir -p website
          unzip -o SecuritySupport.zip -d website

          INDEX_FILE="$(find website -type f -name index.html | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found in SecuritySupport.zip"
            exit 1
          fi

          WEBSITE_ROOT="$(dirname "$INDEX_FILE")"

          mkdir -p www
          cp -R "$WEBSITE_ROOT"/. www/

          echo "Website extracted successfully."
          ls -la www

      - name: Create Capacitor project
        run: |
          set -e

          npm init -y

          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          npx cap init "Security Support" "com.securitysupport.app" --web-dir www
          npx cap add android

      - name: Configure Android Back Button and Layout
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/securitysupport/app

          cat > android/app/src/main/java/com/securitysupport/app/MainActivity.java <<'EOF'
          package com.securitysupport.app;

          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.webkit.WebView;

          import androidx.core.view.WindowCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Keep app content inside the system-bar boundaries.
                  WindowCompat.setDecorFitsSystemWindows(
                      getWindow(), true
                  );

                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                      | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  );

                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      getWindow().setNavigationBarContrastEnforced(false);
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (getBridge() == null
                      || getBridge().getWebView() == null) {
                      super.onBackPressed();
                      return;
                  }

                  WebView webView = getBridge().getWebView();
                  String currentUrl = webView.getUrl();

                  // On the local home page, Back should close the app.
                  if (currentUrl != null
                      && (currentUrl.equals("http://localhost/")
                      || currentUrl.equals("http://localhost/index.html")
                      || currentUrl.equals("https://localhost/")
                      || currentUrl.equals("https://localhost/index.html"))) {
                      finish();
                      return;
                  }

                  // On another page, return to the previous page.
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      finish();
                  }
              }
          }
          EOF

      - name: Prepare App Logo
        shell: bash
        run: |
          set -e

          mkdir -p assets

          LOGO_FILE="$(find www -type f \
            \( -iname 'logo.png' \
            -o -iname 'icon.png' \
            -o -iname 'app-icon.png' \
            -o -iname 'nabha.png' \) \
            | head -n 1)"

          if [ -n "$LOGO_FILE" ]; then
            echo "Logo found: $LOGO_FILE"
            cp "$LOGO_FILE" assets/icon.png
          else
            echo "No supported logo filename found."
            echo "Existing default Android icon will be retained."
          fi

      - name: Generate Android App Icon
        shell: bash
        run: |
          set -e

          if [ -f assets/icon.png ]; then
            npm install --no-save @capacitor/assets@latest
            npx capacitor-assets generate --android
          else
            echo "Skipping icon generation."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecuritySupport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
