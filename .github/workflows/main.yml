name: Build Security Support APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Security Support.zip"
      - "logo.png"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract website
        shell: bash
        run: |
          set -e

          mkdir -p website
          unzip -o "Security Support.zip" -d website

          INDEX_FILE="$(find website -type f -name index.html | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found in Security Support.zip"
            exit 1
          fi

          WEBSITE_ROOT="$(dirname "$INDEX_FILE")"

          mkdir -p www
          cp -R "$WEBSITE_ROOT"/. www/

          echo "Website files copied successfully."
          ls -la www

      - name: Create Capacitor project
        shell: bash
        run: |
          set -e

          npm init -y

          npm install @capacitor/core@latest @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest

          npx cap init "Security Support" "com.securitysupport.app" --web-dir www

          npx cap add android

      - name: Setup App Logo
        shell: bash
        run: |
          set -e

          if [ ! -f "logo.png" ]; then
            echo "ERROR: logo.png not found in repository root."
            exit 1
          fi

          npm install --no-save sharp

          mkdir -p scripts

          cat > scripts/generate-icons.cjs <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const source = path.resolve('logo.png');
          const output = path.resolve('android/app/src/main/res');

          const sizes = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192
          };

          async function main() {
            for (const [folder, size] of Object.entries(sizes)) {
              const dir = path.join(output, folder);

              fs.mkdirSync(dir, { recursive: true });

              const icon = await sharp(source)
                .resize(size, size, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .png()
                .toBuffer();

              fs.writeFileSync(
                path.join(dir, 'ic_launcher.png'),
                icon
              );

              fs.writeFileSync(
                path.join(dir, 'ic_launcher_round.png'),
                icon
              );
            }

            console.log('All launcher icons generated successfully.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node scripts/generate-icons.cjs

      - name: Configure Android Back Button
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/securitysupport/app

          cat > android/app/src/main/java/com/securitysupport/app/MainActivity.java <<'EOF'
          package com.securitysupport.app;

          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (getBridge() == null
                      || getBridge().getWebView() == null) {
                      super.onBackPressed();
                      return;
                  }

                  WebView webView = getBridge().getWebView();

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      finish();
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android Launcher Icon
        shell: bash
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if ! grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"; then
            echo "ERROR: Expected launcher icon reference not found."
            cat "$MANIFEST"
            exit 1
          fi

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            ICON="android/app/src/main/res/mipmap-${density}/ic_launcher.png"

            if [ ! -f "$ICON" ]; then
              echo "ERROR: Missing launcher icon: $ICON"
              exit 1
            fi
          done

          echo "Launcher icon configuration verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecuritySupport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
