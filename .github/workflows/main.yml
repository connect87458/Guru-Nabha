name: Build Security Support APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SecuritySupport.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract website
        shell: bash
        run: |
          set -e

          mkdir -p website
          unzip -o SecuritySupport.zip -d website

          INDEX_FILE="$(find website -type f -name index.html | head -n 1)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found in SecuritySupport.zip"
            exit 1
          fi

          WEBSITE_ROOT="$(dirname "$INDEX_FILE")"

          mkdir -p www
          cp -R "$WEBSITE_ROOT"/. www/

          echo "Website files copied successfully."

      - name: Create Capacitor project
        run: |
          set -e

          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          npx cap init "Security Support" "com.securitysupport.app" --web-dir www
          npx cap add android

      - name: Configure Android Window and Back Button
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/securitysupport/app

          cat > android/app/src/main/java/com/securitysupport/app/MainActivity.java <<'EOF'
          package com.securitysupport.app;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Toast;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private long lastBackPress = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);

                  if (Build.VERSION.SDK_INT >= 29) {
                      getWindow().setNavigationBarContrastEnforced(false);
                  }

                  if (Build.VERSION.SDK_INT >= 30) {
                      getWindow().setDecorFitsSystemWindows(true);
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_VISIBLE
                      );
                  }

                  if (Build.VERSION.SDK_INT >= 23) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR
                          | View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (getBridge() != null
                      && getBridge().getWebView() != null
                      && getBridge().getWebView().canGoBack()) {

                      getBridge().getWebView().goBack();
                      return;
                  }

                  long now = System.currentTimeMillis();

                  if (now - lastBackPress < 2000) {
                      finish();
                  } else {
                      lastBackPress = now;

                      Toast.makeText(
                          this,
                          "Press back again to exit",
                          Toast.LENGTH_SHORT
                      ).show();
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecuritySupport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
