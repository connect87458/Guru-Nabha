- name: Configure Android Back Button
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/securitysupport/app

          cat > android/app/src/main/java/com/securitysupport/app/MainActivity.java <<'EOF'
          package com.securitysupport.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(
                      android.graphics.Color.WHITE
                  );

                  getWindow().setNavigationBarColor(
                      android.graphics.Color.WHITE
                  );

                  if (android.os.Build.VERSION.SDK_INT >= 29) {
                      getWindow().setNavigationBarContrastEnforced(false);
                  }
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (getBridge() != null
                      && getBridge().getWebView() != null
                      && getBridge().getWebView().canGoBack()) {

                      getBridge().getWebView().goBack();

                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
